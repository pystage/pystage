[metadata]
name = pystage
version = 0.3.0a1
author = Kai Eckert
author_email = k.eckert@hs-mannheim.de
description = Scratch-like Python programming
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/pystage/pystage
license = MIT
license_files =
    LICENSE
    THIRD-PARTY-NOTICES.md
project_urls =
    Bug Tracker = https://github.com/pystage/pystage/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    pygame-ce>=2.5.8
    jinja2

[options.packages.find]
where = src
exclude =
    tests*

[options.package_data]
pystage =
    images/*
    fonts/*
    fonts/scratch/*
    fonts/scratch/licenses/*
    fonts/LICENSE-Roboto.txt
    sounds/*
    l10n/data/*/*.tsv
